<title>Estructura de Datos — INF 222</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,500&family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#F3F1EA;
    --surface:#FFFFFF;
    --surface-2:#EAE7DC;
    --ink:#1B2030;
    --ink-soft:#3C4256;
    --muted:#6C7386;
    --line:#D9D5C7;
    --amber:#9C6B15;
    --amber-strong:#7A5210;
    --teal:#2F6F68;
    --teal-strong:#245751;
    --exam:#8A3324;
    --exam-bg:#F6E4DE;
    --shadow:0 18px 40px -22px rgba(27,32,48,.35);
    --radius:14px;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#12161F;
      --surface:#1B2131;
      --surface-2:#232B3E;
      --ink:#EDEAE0;
      --ink-soft:#C7CADA;
      --muted:#8B90A6;
      --line:#323A52;
      --amber:#D9A441;
      --amber-strong:#EFC06B;
      --teal:#5CB0A6;
      --teal-strong:#7BC7BD;
      --exam:#E39482;
      --exam-bg:#3B2420;
      --shadow:0 24px 60px -20px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#12161F;
    --surface:#1B2131;
    --surface-2:#232B3E;
    --ink:#EDEAE0;
    --ink-soft:#C7CADA;
    --muted:#8B90A6;
    --line:#323A52;
    --amber:#D9A441;
    --amber-strong:#EFC06B;
    --teal:#5CB0A6;
    --teal-strong:#7BC7BD;
    --exam:#E39482;
    --exam-bg:#3B2420;
    --shadow:0 24px 60px -20px rgba(0,0,0,.6);
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:"Source Sans 3",system-ui,sans-serif;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--amber);color:#1B2030;}

  h1,h2,h3{font-family:"Newsreader",Georgia,serif;font-weight:600;margin:0;text-wrap:balance;}
  .mono{font-family:"JetBrains Mono",ui-monospace,monospace;}

  a,button{font-family:inherit;}
  button{cursor:pointer;}
  :focus-visible{outline:2px solid var(--amber-strong);outline-offset:3px;border-radius:6px;}

  /* ---------- App shell ---------- */
  #app{position:relative;height:100dvh;width:100%;}

  header.topbar{
    position:fixed;top:0;left:0;right:0;
    display:flex;align-items:center;justify-content:space-between;
    padding:14px clamp(16px,4vw,40px);
    z-index:40;
    pointer-events:none;
  }
  header.topbar > *{pointer-events:auto;}
  .course-tag{
    display:flex;align-items:center;gap:10px;
    font-family:"JetBrains Mono";font-size:12px;letter-spacing:.06em;
    color:var(--muted);text-transform:uppercase;
  }
  .course-tag .dot{width:7px;height:7px;border-radius:50%;background:var(--amber);}
  .topbar-right{display:flex;align-items:center;gap:8px;}
  .icon-btn{
    display:flex;align-items:center;justify-content:center;
    width:36px;height:36px;border-radius:10px;
    border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);
    font-size:15px;transition:transform .15s ease,border-color .15s ease;
  }
  .icon-btn:hover{border-color:var(--amber);color:var(--ink);}
  .icon-btn:active{transform:scale(.94);}
  .counter{
    font-family:"JetBrains Mono";font-size:12px;color:var(--muted);
    font-variant-numeric:tabular-nums;min-width:52px;text-align:right;
  }

  /* ---------- Stage ---------- */
  #stage{
    position:relative;height:100%;width:100%;
    display:flex;align-items:center;justify-content:center;
    padding:clamp(64px,8vh,96px) clamp(16px,6vw,72px) clamp(56px,7vh,72px);
  }
  .slide{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    padding:clamp(64px,8vh,96px) clamp(16px,6vw,72px) clamp(56px,7vh,72px);
    opacity:0;transform:translateY(14px) scale(.99);
    transition:opacity .38s ease, transform .38s ease;
    pointer-events:none;
  }
  .slide.active{opacity:1;transform:translateY(0) scale(1);pointer-events:auto;z-index:5;}
  @media (prefers-reduced-motion:reduce){
    .slide{transition:opacity .01s linear;transform:none;}
  }

  .card{
    width:100%;max-width:1180px;max-height:100%;
    overflow-y:auto;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:20px;
    box-shadow:var(--shadow);
    padding:clamp(28px,4vw,52px) clamp(28px,5vw,64px);
    position:relative;
  }
  .card::-webkit-scrollbar{width:8px;}
  .card::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;}

  .index-stamp{
    position:absolute;top:clamp(20px,3vw,40px);right:clamp(24px,4vw,52px);
    font-family:"JetBrains Mono";font-weight:700;
    font-size:clamp(28px,4vw,44px);
    color:var(--amber);opacity:.85;
    letter-spacing:-.02em;
  }

  .eyebrow{
    font-family:"JetBrains Mono";font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--teal-strong);margin-bottom:14px;display:flex;align-items:center;gap:10px;
  }
  .eyebrow .sep{color:var(--line);}

  .badges{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 6px;}
  .badge{
    font-family:"JetBrains Mono";font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;
    padding:5px 11px;border-radius:999px;border:1px solid var(--line);color:var(--ink-soft);
  }
  .badge.exam{background:var(--exam-bg);color:var(--exam);border-color:transparent;font-weight:700;}
  .badge.checkpoint{background:var(--surface-2);color:var(--teal-strong);border-color:transparent;font-weight:700;}

  h2.slide-title{font-size:clamp(26px,3.4vw,40px);line-height:1.12;max-width:20ch;}

  .field-grid{
    margin-top:clamp(22px,3vw,32px);
    display:grid;grid-template-columns:1.1fr 1fr;gap:clamp(20px,3vw,40px);
  }
  @media (max-width:820px){.field-grid{grid-template-columns:1fr;}}

  .obj-list{list-style:none;margin:0;padding:0 0 0 20px;border-left:2px dotted var(--line);position:relative;}
  .obj-list li{position:relative;padding:2px 0 16px 16px;font-size:15.5px;line-height:1.5;color:var(--ink-soft);}
  .obj-list li:last-child{padding-bottom:0;}
  .obj-list li::before{
    content:"";position:absolute;left:-25px;top:6px;width:9px;height:9px;border-radius:50%;
    background:var(--surface);border:2px solid var(--amber);
  }
  .field-label{
    font-family:"JetBrains Mono";font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--muted);margin:0 0 8px;
  }
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px;}
  .chip{
    font-size:13px;padding:4px 10px;border-radius:8px;background:var(--surface-2);color:var(--ink-soft);
    border:1px solid transparent;
  }

  .field-card{
    background:var(--surface-2);border-radius:12px;padding:14px 16px;margin-bottom:12px;
  }
  .field-card p{margin:0;font-size:14.5px;line-height:1.55;color:var(--ink-soft);}
  .field-card .quote{
    font-family:"Newsreader";font-style:italic;color:var(--ink);font-size:15px;
    border-left:2px solid var(--amber);padding-left:10px;margin:8px 0 0;
  }
  .field-card .tech{
    margin-top:8px;font-size:13px;color:var(--teal-strong);font-weight:600;
  }

  .evidence{
    margin-top:16px;display:flex;align-items:center;gap:10px;
    font-family:"JetBrains Mono";font-size:13px;color:var(--ink);
    background:linear-gradient(0deg,var(--surface-2),var(--surface-2));
    border:1px dashed var(--amber);border-radius:10px;padding:10px 14px;
  }
  .evidence b{color:var(--amber-strong);}

  /* ---------- Rules ("reglas del juego") slides ---------- */
  .rule-grid{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:clamp(14px,2vw,20px);margin-top:clamp(20px,3vw,28px);
  }
  .rule-card{
    border-radius:12px;padding:16px 18px;background:var(--surface-2);
    border-left:4px solid var(--line);
  }
  .rule-card h4{
    font-family:"JetBrains Mono";font-size:12px;letter-spacing:.06em;text-transform:uppercase;
    margin:0 0 10px;color:var(--ink-soft);
  }
  .rule-card ul{list-style:none;margin:0;padding:0;}
  .rule-card li{
    font-size:14px;line-height:1.5;color:var(--ink-soft);padding:5px 0 5px 20px;position:relative;
  }
  .rule-card li::before{position:absolute;left:0;top:5px;font-weight:700;font-size:12px;}
  .rule-card.tone-info{border-left-color:var(--muted);}
  .rule-card.tone-info li::before{content:"—";color:var(--muted);}
  .rule-card.tone-allow{border-left-color:var(--teal);}
  .rule-card.tone-allow h4{color:var(--teal-strong);}
  .rule-card.tone-allow li::before{content:"✓";color:var(--teal-strong);}
  .rule-card.tone-warn{border-left-color:var(--amber);}
  .rule-card.tone-warn h4{color:var(--amber-strong);}
  .rule-card.tone-warn li::before{content:"◆";color:var(--amber-strong);}
  .rule-card.tone-forbid{border-left-color:var(--exam);background:var(--exam-bg);}
  .rule-card.tone-forbid h4{color:var(--exam);}
  .rule-card.tone-forbid li::before{content:"✕";color:var(--exam);}
  .rule-card.tone-forbid li{color:var(--ink);}

  /* ---------- Module divider slide ---------- */
  .divider-card{
    text-align:left;max-width:900px;
    background:transparent;border:none;box-shadow:none;padding:0;
  }
  .divider-num{
    font-family:"JetBrains Mono";font-size:clamp(60px,11vw,140px);font-weight:700;
    color:var(--amber);line-height:.85;letter-spacing:-.03em;
  }
  .divider-title{font-size:clamp(30px,5vw,56px);margin-top:6px;max-width:16ch;}
  .divider-meta{
    margin-top:18px;font-family:"JetBrains Mono";font-size:14px;color:var(--muted);
    display:flex;gap:18px;flex-wrap:wrap;
  }
  .divider-meta span{color:var(--teal-strong);}
  .divider-weeks{
    margin-top:28px;display:flex;gap:10px;flex-wrap:wrap;
  }
  .week-pill{
    font-family:"JetBrains Mono";font-size:13px;padding:7px 14px;border-radius:999px;
    border:1px solid var(--line);color:var(--ink-soft);background:var(--surface);
  }

  /* ---------- Intro slide ---------- */
  .intro-card{max-width:920px;background:transparent;border:none;box-shadow:none;text-align:left;}
  .intro-kicker{
    font-family:"JetBrains Mono";font-size:13px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--teal-strong);margin-bottom:18px;
  }
  .intro-title{font-size:clamp(38px,6.5vw,72px);line-height:1.02;}
  .intro-title em{color:var(--amber);font-style:normal;}
  .intro-sub{margin-top:16px;font-size:clamp(16px,2vw,20px);color:var(--ink-soft);max-width:46ch;line-height:1.5;}
  .intro-facts{
    margin-top:clamp(28px,4vw,44px);display:grid;grid-template-columns:repeat(3,1fr);gap:1px;
    background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;
  }
  .fact{background:var(--surface);padding:16px 18px;}
  .fact .k{font-family:"JetBrains Mono";font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);}
  .fact .v{margin-top:6px;font-size:15px;color:var(--ink);font-weight:600;line-height:1.4;}
  @media (max-width:700px){.intro-facts{grid-template-columns:1fr 1fr;}}

  /* ---------- Overview / evaluation slide bars ---------- */
  .eval-bar{height:34px;border-radius:8px;overflow:hidden;display:flex;margin-top:10px;border:1px solid var(--line);}
  .eval-bar > div{display:flex;align-items:center;justify-content:center;font-family:"JetBrains Mono";font-size:12px;color:#fff;font-weight:600;}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,4vw,48px);margin-top:20px;}
  @media (max-width:820px){.two-col{grid-template-columns:1fr;}}
  .list-clean{list-style:none;margin:0;padding:0;}
  .list-clean li{padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px;color:var(--ink-soft);display:flex;gap:10px;}
  .list-clean li:last-child{border-bottom:none;}
  .list-clean li::before{content:"—";color:var(--amber);flex:none;}
  .ai-levels{display:flex;flex-direction:column;gap:10px;margin-top:10px;}
  .ai-level{border-radius:10px;padding:10px 14px;font-size:13.5px;border:1px solid var(--line);}
  .ai-level b{font-family:"JetBrains Mono";font-size:11px;text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:3px;}
  .ai-level.free{border-color:var(--teal);color:var(--teal-strong);}
  .ai-level.declare{border-color:var(--amber);color:var(--amber-strong);}
  .ai-level.forbid{border-color:var(--exam);color:var(--exam);}

  /* ---------- Bottom controls ---------- */
  .navctl{
    position:fixed;left:0;right:0;bottom:0;
    display:flex;align-items:center;justify-content:space-between;
    padding:14px clamp(16px,4vw,40px);z-index:40;
    pointer-events:none;
  }
  .navctl > *{pointer-events:auto;}
  .nav-btn{
    display:flex;align-items:center;gap:8px;
    background:var(--surface);border:1px solid var(--line);color:var(--ink);
    padding:9px 16px;border-radius:999px;font-size:13.5px;font-weight:600;
    box-shadow:var(--shadow);transition:transform .15s ease,opacity .15s ease;
  }
  .nav-btn:hover{transform:translateY(-2px);}
  .nav-btn:active{transform:translateY(0);}
  .nav-btn[disabled]{opacity:.35;pointer-events:none;box-shadow:none;}
  .nav-btn .k{font-family:"JetBrains Mono";font-size:11px;opacity:.6;}

  .progress-track{
    position:fixed;left:0;right:0;bottom:0;height:4px;display:flex;z-index:39;background:var(--line);
  }
  .progress-seg{height:100%;background:var(--surface-2);position:relative;cursor:pointer;}
  .progress-seg + .progress-seg{border-left:1px solid var(--bg);}
  .progress-seg .fill{position:absolute;inset:0;background:var(--amber);transform:scaleX(0);transform-origin:left;transition:transform .25s ease;}
  .progress-seg.done .fill{transform:scaleX(1);}
  .progress-seg.current .fill{transform:scaleX(var(--p,0));}

  /* ---------- Overview overlay ---------- */
  #overview{
    position:fixed;inset:0;z-index:60;background:color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter:blur(6px);
    display:none;padding:clamp(24px,5vw,64px);overflow-y:auto;
  }
  #overview.open{display:block;}
  .ov-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;}
  .ov-head h3{font-size:clamp(20px,3vw,28px);}
  .ov-groups{display:flex;flex-direction:column;gap:28px;max-width:1100px;margin:0 auto;}
  .ov-mod-label{
    font-family:"JetBrains Mono";font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--amber);
    margin-bottom:10px;
  }
  .ov-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;}
  .ov-item{
    text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;
    padding:12px 14px;color:var(--ink-soft);font-size:13.5px;line-height:1.4;
  }
  .ov-item:hover{border-color:var(--amber);color:var(--ink);}
  .ov-item .n{font-family:"JetBrains Mono";font-size:11px;color:var(--muted);display:block;margin-bottom:4px;}
  .ov-item.current{border-color:var(--amber);background:var(--surface-2);}

  /* ---------- shortcuts panel ---------- */
  #shortcuts{
    position:fixed;bottom:70px;right:clamp(16px,4vw,40px);z-index:61;
    background:var(--surface);border:1px solid var(--line);border-radius:12px;
    box-shadow:var(--shadow);padding:16px 18px;font-size:13px;color:var(--ink-soft);
    display:none;min-width:220px;
  }
  #shortcuts.open{display:block;}
  #shortcuts h4{font-family:"JetBrains Mono";font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 10px;}
  #shortcuts .row{display:flex;justify-content:space-between;padding:4px 0;}
  #shortcuts kbd{font-family:"JetBrains Mono";background:var(--surface-2);border-radius:5px;padding:2px 6px;font-size:11.5px;}

  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;}
</style>

<div id="app">
  <header class="topbar">
    <div class="course-tag"><span class="dot"></span> Estructura de Datos · INF 222</div>
    <div class="topbar-right">
      <span class="counter mono" id="counter" aria-live="polite">01 / 22</span>
      <button class="icon-btn" id="btnOverview" aria-label="Ver todas las diapositivas (tecla O)" title="Ver todas (O)">▦</button>
      <button class="icon-btn" id="btnHelp" aria-label="Atajos de teclado" title="Atajos (?)">?</button>
    </div>
  </header>

  <main id="stage" role="region" aria-label="Diapositiva actual" aria-live="polite"></main>

  <div class="navctl">
    <button class="nav-btn" id="btnPrev" aria-label="Diapositiva anterior"><span aria-hidden="true">←</span> Anterior <span class="k">◄</span></button>
    <button class="nav-btn" id="btnNext" aria-label="Siguiente diapositiva">Siguiente <span aria-hidden="true">→</span> <span class="k">►</span></button>
  </div>
  <div class="progress-track" id="progressTrack"></div>

  <div id="overview" role="dialog" aria-modal="true" aria-label="Índice de diapositivas">
    <div class="ov-head">
      <h3>Índice del semestre</h3>
      <button class="icon-btn" id="btnCloseOverview" aria-label="Cerrar índice">✕</button>
    </div>
    <div class="ov-groups" id="ovGroups"></div>
  </div>

  <div id="shortcuts" role="dialog" aria-label="Atajos de teclado">
    <h4>Atajos de teclado</h4>
    <div class="row"><span>Siguiente</span><kbd>→</kbd></div>
    <div class="row"><span>Anterior</span><kbd>←</kbd></div>
    <div class="row"><span>Primera / última</span><kbd>Home</kbd>/<kbd>End</kbd></div>
    <div class="row"><span>Índice</span><kbd>O</kbd></div>
    <div class="row"><span>Cerrar</span><kbd>Esc</kbd></div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var MODULES = [
    {n:1, title:"Estructuras de datos lineales", weeks:"Semanas 1–3", hours:"18 horas", desc:"Pilas, colas y su análisis de complejidad con la notación Big-O."},
    {n:2, title:"Estructuras dinámicas lineales", weeks:"Semanas 4–7", hours:"24 horas", desc:"Punteros/referencias en Python y listas enlazadas en todas sus variantes."},
    {n:3, title:"Recursividad, ordenación y búsqueda", weeks:"Semanas 8–11", hours:"24 horas", desc:"Funciones recursivas, algoritmos clásicos de ordenar y buscar."},
    {n:4, title:"Estructura avanzada de datos", weeks:"Semanas 12–15", hours:"24 horas", desc:"Árboles binarios, BST y grafos con sus recorridos."}
  ];

  var RULES = [
    {title:"Primera clase — Bienvenida y reglas del juego",
      cards:[
        {label:"Agenda de hoy", tone:"info", items:[
          "Bienvenida y presentación del docente",
          "Recorrido del syllabus de INF 222",
          "Reglas del juego del curso (siguientes diapositivas)",
          "Configuración de Python 3, VS Code, y tu usuario de GitHub para Google Classroom"
        ]},
        {label:"Antes de la próxima clase", tone:"info", items:[
          "Cuenta de GitHub activa",
          "Python 3 y VS Code instalados",
          "Syllabus leído completo",
          "Traer dudas sobre evaluación o política de IA"
        ]}
      ]},
    {title:"Reglas del juego — Asistencia e integridad académica",
      cards:[
        {label:"Asistencia y puntualidad", tone:"info", items:[
          "Obligatoria en teoría y laboratorio; se registra cada sesión",
          "Tolerancia de 10 minutos de ingreso a clase",
          "Inasistencias a evaluaciones se justifican según la normativa de la Facultad",
          "El estudiante es responsable de ponerse al día tras una ausencia"
        ]},
        {label:"Integridad académica — no se permite", tone:"forbid", items:[
          "Copiar el trabajo de otro estudiante o equipo sin atribución",
          "Presentar como propio un código que no comprenden",
          "Dispositivos o recursos no autorizados durante un parcial",
          "Uso no declarado de IA donde su uso requiere declaración"
        ]}
      ]},
    {title:"Reglas del juego — Uso de inteligencia artificial",
      cards:[
        {label:"Nivel 1 — Libre, sin declarar", tone:"allow", items:[
          "Consultas conceptuales durante el estudio autónomo",
          "Corrector ortográfico/gramatical en documentación no técnica",
          "Ejercicios de práctica adicionales no calificados"
        ]},
        {label:"Nivel 2 — Con declaración obligatoria", tone:"warn", items:[
          "Aplica a laboratorios y al proyecto final",
          "Código de apoyo, depuración, sugerencias de estilo, trazados de ejecución",
          "Declarar herramienta, para qué se usó y qué verificaron",

            '<ul class="list-clean">' +
              '<li>Equipos de 3–4 integrantes, formados en la semana 3</li>' +
              '<li>Aplica al menos 3 estructuras de datos del curso, justificadas</li>' +
              '<li>Propuesta (S7, 10%) · Checkpoint 1 (S10, 10%) · Checkpoint 2 (S14, 10%) · Sustentación (S15, 70%)</li>' +
              '<li>Repositorio <b>propio y separado</b> del proyecto (plantilla grupal en GitHub)</li>' +
              '<li>Declaración explícita de uso de IA en el README</li>' +
            '</ul>' +
          '</div>' +
          '<div>' +
            '<p class="field-label">Reglas clave del curso</p>' +
            '<ul class="list-clean">' +
              '<li>Periodo de gracia de 24h en entregas, con -20% de penalización</li>' +
              '<li>Honestidad académica: código propio, explicable sin apoyo de IA</li>' +
              '<li>2 repos plantilla en GitHub: laboratorios (individual) + proyecto (equipo)</li>' +
              '<li>Dudas fuera de clase: angel.avila@up.ac.pa (respuesta en 48h hábiles)</li>' +
            '</ul>' +
          '</div>' +
        '</div>' +
      '</div>'
    );
  }

  function renderSlide(i){
    var s = slides[i];
    if(s.type==="intro") return renderIntro();
    if(s.type==="rules") return renderRules(s.data);
    if(s.type==="overview") return renderOverviewSlide();
    if(s.type==="module") return renderModule(s);
    if(s.type==="week") return renderWeek(s.data);
    if(s.type==="closing") return renderClosing();
    return "";
  }

  function buildProgress(){
    track.innerHTML = "";
    slides.forEach(function(s,i){
      var seg = document.createElement("div");
      seg.className = "progress-seg";
      seg.style.flex = "1 1 0";
      seg.dataset.i = i;
      seg.innerHTML = '<div class="fill"></div>';
      seg.setAttribute("role","button");
      seg.setAttribute("aria-label", "Ir a diapositiva " + (i+1));
      seg.addEventListener("click", function(){ goTo(i); });
      track.appendChild(seg);
    });
  }

  function updateProgress(){
    var segs = track.children;
    for(var i=0;i<segs.length;i++){
      segs[i].classList.toggle("done", i<current);
      segs[i].classList.toggle("current", i===current);
    }
  }

  function buildOverview(){
    var wrap = document.getElementById("ovGroups");
    var html = "";
    var groups = {};
    slides.forEach(function(s,i){
      var label, title;
      if(s.type==="intro"){label="Introducción"; title="Portada del curso";}
      else if(s.type==="rules"){label="Primer día · Reglas del juego"; title=s.data.title;}
      else if(s.type==="overview"){label="Introducción"; title="Metodología y evaluación";}
      else if(s.type==="module"){label="Módulo "+s.data.n; title=s.data.title;}
      else if(s.type==="week"){label="Módulo "+s.data.m; title="Semana "+s.data.w+" · "+s.data.title;}
      else if(s.type==="closing"){label="Cierre"; title="Proyecto final y recordatorios";}
      if(!groups[label]) groups[label]=[];
      groups[label].push({i:i, title:title});
    });
    Object.keys(groups).forEach(function(label){
      html += '<div><div class="ov-mod-label">' + label + '</div><div class="ov-grid">';
      groups[label].forEach(function(item){
        html += '<button class="ov-item" data-i="'+item.i+'"><span class="n mono">'+pad(item.i+1)+'</span>'+item.title+'</button>';
      });
      html += '</div></div>';
    });
    wrap.innerHTML = html;
    wrap.querySelectorAll(".ov-item").forEach(function(btn){
      btn.addEventListener("click", function(){
        goTo(parseInt(btn.dataset.i,10));
        closeOverview();
      });
    });
  }

  function markOverviewCurrent(){
    var items = document.querySelectorAll(".ov-item");
    items.forEach(function(el){
      el.classList.toggle("current", parseInt(el.dataset.i,10)===current);
    });
  }

  function render(){
    stage.innerHTML = renderSlide(current);
    var el = stage.firstElementChild;
    requestAnimationFrame(function(){ el.classList.add("active"); });
    counterEl.textContent = pad(current+1) + " / " + total;
    btnPrev.disabled = current===0;
    btnNext.disabled = current===total-1;
    updateProgress();
    markOverviewCurrent();
  }

  function goTo(i){
    current = Math.max(0, Math.min(total-1, i));
    render();
  }
  function next(){ if(current<total-1) goTo(current+1); }
  function prev(){ if(current>0) goTo(current-1); }

  btnPrev.addEventListener("click", prev);
  btnNext.addEventListener("click", next);

  var overviewEl = document.getElementById("overview");
  function openOverview(){ buildOverview(); overviewEl.classList.add("open"); document.getElementById("btnCloseOverview").focus(); }
  function closeOverview(){ overviewEl.classList.remove("open"); }
  document.getElementById("btnOverview").addEventListener("click", openOverview);
  document.getElementById("btnCloseOverview").addEventListener("click", closeOverview);

  var shortcutsEl = document.getElementById("shortcuts");
  document.getElementById("btnHelp").addEventListener("click", function(){ shortcutsEl.classList.toggle("open"); });

  document.addEventListener("keydown", function(e){
    if(e.key==="Escape"){ closeOverview(); shortcutsEl.classList.remove("open"); return; }
    if(overviewEl.classList.contains("open")) return;
    if(e.key==="ArrowRight" || e.key===" "){ e.preventDefault(); next(); }
    else if(e.key==="ArrowLeft"){ e.preventDefault(); prev(); }
    else if(e.key==="Home"){ e.preventDefault(); goTo(0); }
    else if(e.key==="End"){ e.preventDefault(); goTo(total-1); }
    else if(e.key==="o" || e.key==="O"){ openOverview(); }
    else if(e.key==="?"){ shortcutsEl.classList.toggle("open"); }
  });

  var touchX = null;
  stage.addEventListener("touchstart", function(e){ touchX = e.touches[0].clientX; }, {passive:true});
  stage.addEventListener("touchend", function(e){
    if(touchX===null) return;
    var dx = e.changedTouches[0].clientX - touchX;
    if(Math.abs(dx) > 60){ dx < 0 ? next() : prev(); }
    touchX = null;
  }, {passive:true});

  buildProgress();
  render();
})();
</script>
